name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and synthetic probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.12'
      - name: Restore core, harness and probes (high/critical NuGet audit gate)
        # Core restore audits all dependencies; NU1903/NU1904 are errors, not advisory scanner output.
        run: |
          dotnet restore src/BotAgent.Headless/BotAgent.Headless.csproj
          dotnet restore tests/BotAgent.IntegrationHarness/BotAgent.IntegrationHarness.csproj
          dotnet restore tests/BotAgent.ArchitectureProbe/BotAgent.ArchitectureProbe.csproj
          dotnet restore tests/BotAgent.SafetyProbe/BotAgent.SafetyProbe.csproj
          dotnet restore tests/BotAgent.ParticipationProbe/BotAgent.ParticipationProbe.csproj
          dotnet restore tests/BotAgent.ProductionSpecProbe/BotAgent.ProductionSpecProbe.csproj
          dotnet restore tests/BotAgent.ConcurrencyStressProbe/BotAgent.ConcurrencyStressProbe.csproj
          dotnet restore tests/BotAgent.ChaosFaultProbe/BotAgent.ChaosFaultProbe.csproj
          dotnet restore tests/BotAgent.PipelineEval/BotAgent.PipelineEval.csproj
          dotnet restore tests/BotAgent.ReviewRemediationProbe/BotAgent.ReviewRemediationProbe.csproj
          dotnet restore tests/BotAgent.ReverseTransportProbe/BotAgent.ReverseTransportProbe.csproj
          dotnet restore tests/BotAgent.DeadlineGateProbe/BotAgent.DeadlineGateProbe.csproj
          dotnet restore tests/BotAgent.FeishuRemediationProbe/BotAgent.FeishuRemediationProbe.csproj
          dotnet restore tests/BotAgent.SettingsScopeProbe/BotAgent.SettingsScopeProbe.csproj
          dotnet restore tests/BotAgent.SsrfProbe/BotAgent.SsrfProbe.csproj
          dotnet restore tests/BotAgent.McpProbe/BotAgent.McpProbe.csproj
          dotnet restore tests/BotAgent.ZbaProbe/BotAgent.ZbaProbe.csproj
          dotnet restore tests/BotAgent.PluginPackageProbe/BotAgent.PluginPackageProbe.csproj
          dotnet restore tests/BotAgent.PluginMarketProbe/BotAgent.PluginMarketProbe.csproj
          dotnet restore tests/BotAgent.PluginSettingsProbe/BotAgent.PluginSettingsProbe.csproj
          dotnet restore tests/BotAgent.ProtocolProbe/BotAgent.ProtocolProbe.csproj
          dotnet restore tests/BotAgent.SnapshotProbe/BotAgent.SnapshotProbe.csproj
      - name: Build core and harness (Release)
        run: |
          dotnet build src/BotAgent.Headless/BotAgent.Headless.csproj -c Release --no-restore
          dotnet build tests/BotAgent.IntegrationHarness/BotAgent.IntegrationHarness.csproj -c Release --no-restore
      - name: Architecture and safety probes
        run: |
          dotnet run --project tests/BotAgent.ArchitectureProbe/BotAgent.ArchitectureProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.SafetyProbe/BotAgent.SafetyProbe.csproj -c Release --no-restore
      - name: Participation and server-files probes
        run: |
          dotnet run --project tests/BotAgent.ParticipationProbe/BotAgent.ParticipationProbe.csproj -c Release --no-restore
          python tests/BotAgent.ServerFilesProbe/test_server_files.py
      - name: Synthetic persistence, resilience and frontend probes
        run: |
          dotnet run --project tests/BotAgent.ProductionSpecProbe/BotAgent.ProductionSpecProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.ConcurrencyStressProbe/BotAgent.ConcurrencyStressProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.ChaosFaultProbe/BotAgent.ChaosFaultProbe.csproj -c Release --no-restore
          node tests/BotAgent.FrontendProbe/probe.mjs
      - name: Deterministic pipeline evaluation
        run: |
          dotnet run --project tests/BotAgent.PipelineEval/BotAgent.PipelineEval.csproj -c Release --no-restore
      - name: Synthetic review remediation probes
        run: |
          dotnet run --project tests/BotAgent.ReviewRemediationProbe/BotAgent.ReviewRemediationProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.ReverseTransportProbe/BotAgent.ReverseTransportProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.DeadlineGateProbe/BotAgent.DeadlineGateProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.FeishuRemediationProbe/BotAgent.FeishuRemediationProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.SettingsScopeProbe/BotAgent.SettingsScopeProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.SsrfProbe/BotAgent.SsrfProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.McpProbe/BotAgent.McpProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.ZbaProbe/BotAgent.ZbaProbe.csproj -c Release --no-restore
      - name: Provider protocol, plugin and snapshot probes
        run: |
          dotnet run --project tests/BotAgent.ProtocolProbe/BotAgent.ProtocolProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.PluginPackageProbe/BotAgent.PluginPackageProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.PluginMarketProbe/BotAgent.PluginMarketProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.PluginSettingsProbe/BotAgent.PluginSettingsProbe.csproj -c Release --no-restore
          dotnet run --project tests/BotAgent.SnapshotProbe/BotAgent.SnapshotProbe.csproj -c Release --no-restore

  web:
    name: Web build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:unit
      - name: Build static assets
        run: npm run build

  # playwright.config.ts 的 chromium / firefox / webkit 跑同一套用例、同一套断言。
  # 三个引擎拆成独立 job：一是真并行（塞一个 job 串行跑会撞 20 分钟超时），
  # 二是缺引擎时只有对应 job 红，不会被误读成"矩阵整体挂了"。
  e2e:
    name: Browser end-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            engine: chromium
          - browser: firefox
            engine: firefox
          - browser: webkit
            engine: webkit
          - browser: chromium-rate-limit
            engine: chromium
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 8
        # Playwright e2e starts the real Headless host, which the web config builds from source.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static assets
        run: npm run build
      - name: Build Headless host for end-to-end tests
        working-directory: .
        run: dotnet build src/BotAgent.Headless/BotAgent.Headless.csproj -c Release
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Browser end-to-end tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-playwright-${{ matrix.browser }}
          path: |
            src/web/test-results
            src/web/playwright-report
          retention-days: 7

  integration:
    name: Synthetic integration test (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Core & Chat (S1-S17)"
            scenarios: "s1,s3,s4,s5,s6,s7,s8,s9,s10,s11,s12,s13,s14,s15,s16,s17"
          - name: "Media & Tools (S18-S31)"
            scenarios: "s18,s19,s20,s21,s22,s23,s24,s25,s26,s27,s28,s29,s30,s31"
          - name: "Governance & Multi-Platform (S32-S55)"
            scenarios: "s32,s34,s35,s36,s37,s38,s39,s40,s41,s42,s43,s44,s45,s46,s47,s48,s49,s50,s51,s52,s53,s54,s55"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore core and harness (high/critical NuGet audit gate)
        # Both projects independently audit all dependencies; NU1903/NU1904 fail their restores.
        run: |
          dotnet restore src/BotAgent.Headless/BotAgent.Headless.csproj
          dotnet restore tests/BotAgent.IntegrationHarness/BotAgent.IntegrationHarness.csproj
      - name: Build core and harness (Release)
        run: |
          dotnet build src/BotAgent.Headless/BotAgent.Headless.csproj -c Release --no-restore
          dotnet build tests/BotAgent.IntegrationHarness/BotAgent.IntegrationHarness.csproj -c Release --no-restore
      - name: Run synthetic integration suite
        env:
          QQCHAT_IT_ONLY: ${{ matrix.scenarios }}
        run: dotnet tests/BotAgent.IntegrationHarness/bin/Release/net8.0/BotAgent.IntegrationHarness.dll
