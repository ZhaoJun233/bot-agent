# ══════════════════════════════════════════════════════════════
#  Bot Agent（Headless）+ NapCat 全容器部署
#
#  用法：
#    cp .env.example .env      # 填写 API Key / 白名单 / QQ 号
#    docker compose up -d
#    docker compose logs -f napcat      # 首次登录看二维码
#
#  首次登录（一次性）：
#    1) docker compose logs napcat   →  用手机 QQ 扫日志里的二维码
#    2) 浏览器打开 http://<主机IP>:6099 →  WebUI 里开启「正向 WS」
#       端口 3001，Token 与 .env 的 ONEBOT_TOKEN 一致
#    3) docker compose restart qqchat   →  readyz 变 200
#
#  或者用反向 WS（不用登 WebUI 开端口，见文件底部的说明）
# ══════════════════════════════════════════════════════════════

services:
  # ─────────── QQ 协议端（Linux QQ + NapCat） ───────────
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqchat-napcat
    restart: unless-stopped
    # 日志上限：不用它的话 json-file 日志会把小硬盘吃满（实测 8.8G 盘跑到 90%）。
    # ⚠ 给已部署的 napcat 补这一段必须**重建容器**才生效 —— 那有可能要重新扫码登录，
    #   所以拿到老部署上时：新装的照配，已经跑着的别动（或者自己承担重扫风险）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # 容器内 Linux QQ 的运行用户，需与挂载目录属主一致
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      # 快速登录：带上 QQ 号后，重启容器会复用 ./napcat/ntqq 里的登录态，无需重新扫码。
      # ⚠ 这两行（TZ / ACCOUNT）很容易在“把仓库版 compose 覆盖到部署目录”时被弄丢，
      #   丢了之后 ACCOUNT 为空 → NapCat 只能出二维码 → 需要人工重新扫码。
      - ACCOUNT=${BOT_UIN:-}
    ports:
      # OneBot 正向 WS：机器人（qqchat 容器）通过内部网络访问，无需对宿主机暴露
      - "127.0.0.1:3001:3001"
      # WebUI 管理面板：仅本机可访问。要用手机/外网扫码请改成 "6099:6099"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config          # NapCat / OneBot 配置
      - ./napcat/ntqq:/app/.config/QQ               # 登录态（重启免扫码）
    networks:
      - qqchat

  # ─────────── AI 机器人 ───────────
  qqchat:
    build:
      context: .
      dockerfile: src/BotAgent.Headless/Dockerfile
    image: qqchat-agent:latest
    container_name: qqchat-bot
    restart: unless-stopped
    # 日志上限：日志只在 /data/logs 里自己轮转，但 docker 也会再收一份 stdout，
    # 小硬盘上不设上限迟早吃满（部署机实测磁盘 90%）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - napcat
    # ── “透过 docker 操作服务器”的挂载（号主 2026-09-18 要的能力）──
    # ④ docker.sock：agent 能用 `docker ps / logs / exec / run -v /:/host …` 看和改服务器
    # ⑤ /opt/qqchat → /host/qqchat：直接就能读写部署目录（不用 pull 镜像、不用 socket）
    # ⚠️ 这两个挂载是**常挂**的（compose 的挂载不能在运行时改）；
    #    面板上的「允许 agent 用 docker 操作服务器」开关决定 agent **会不会去用**它们
    #    —— 关着的时候它的工具表里没有 docker，提示词也不提这两条路径。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/qqchat:/host/qqchat
    environment:
      # ---- 模型（OpenAI 兼容：DeepSeek / OpenAI / 通义 / 本地 Ollama 等）----
      QQCHAT_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      QQCHAT_API_KEY: ${MODEL_API_KEY:?请在 .env 里填 MODEL_API_KEY}
      QQCHAT_MODEL: ${MODEL_NAME:-gpt-4o-mini}
      QQCHAT_MAX_TOKENS: ${MAX_TOKENS:-2048}

      # ---- QQ 通道：正向 WS 连到 napcat 容器 ----
      QQCHAT_ONEBOT_PROTOCOL: ForwardWebSocket
      QQCHAT_ONEBOT_URL: ws://napcat:3001
      QQCHAT_ONEBOT_TOKEN: ${ONEBOT_TOKEN:-}

      # ---- 机器人身份与行为 ----
      QQCHAT_UIN: ${BOT_UIN:-}
      QQCHAT_WHITELIST: ${WHITELIST:?请在 .env 里填 WHITELIST（* 表示全部，空值=忽略所有消息）}
      QQCHAT_PERSONA: ${BOT_PERSONA:-}
      QQCHAT_AI_DESIRE: ${AI_DESIRE:-50}
      QQCHAT_AI_MODE: ${AI_MODE:-1}

      # ---- 回复节奏 ----
      QQCHAT_GROUP_COOLDOWN: ${GROUP_COOLDOWN:-8}
      QQCHAT_PRIVATE_COOLDOWN: ${PRIVATE_COOLDOWN:-3}
      QQCHAT_IDLE_FALLBACK: ${IDLE_FALLBACK:-60}
      QQCHAT_SPLIT_REPLIES: ${SPLIT_REPLIES:-1}
      QQCHAT_SEGMENT_DELAY_MS: ${SEGMENT_DELAY_MS:-700}

      # ---- 运维 ----
      QQCHAT_HEALTH_PORT: 8080
      QQCHAT_HEALTH_BIND: "+"
      # 面板访问令牌（可选）。设了之后访问面板要带 ?token=xxx（会自动记住）；
      # /healthz 与 /readyz 不受影响，容器健康检查照常工作。
      # 注意：这类变量必须写在本文件的 environment 里才会进容器 ——
      # .env 只用于 compose 的 ${VAR} 变量替换，不会自动传给容器。
      QQCHAT_PANEL_TOKEN: ${PANEL_TOKEN:-}
      # 面板内扫码登录：机器人向 NapCat WebUI 取登录二维码（用户可以不出面板就扫码）
      # 令牌值见 napcat/config/webui.json 的 token 字段；不配也不影响消息通道，
      # 只是面板里那个「扫码登录」卡片会提示未配置。
      QQCHAT_NAPCAT_WEBUI_URL: ${NAPCAT_WEBUI_URL:-http://napcat:6099}
      QQCHAT_NAPCAT_WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}

      # ---- 本机 Agent（// 命令：内外两个后端，公用一份 QQ 白名单）----
      # ① 服务器内置 agent：跑在容器里的工具循环（bash / 读 / 写 / 抓网页）
      # ② 外部设备 agent：号主电脑上的 pi，本机跑 pi-bridge.py 主动连进来
      #    桥的地址就是面板端口 /agent-bridge（本机用 ssh -L 转过去，不用给公网开端口）
      # ⚠ AGENT_TOKEN 必须有值 —— 这条连接能在号主电脑上执行命令，不配令牌就一律拒绝连接。
      QQCHAT_AGENT: ${AGENT_ENABLED:-0}
      QQCHAT_AGENT_USERS: ${AGENT_USERS:-}
      QQCHAT_AGENT_TOKEN: ${AGENT_TOKEN:-}
      QQCHAT_AGENT_PREFIX: ${AGENT_PREFIX:-//}
      QQCHAT_AGENT_WORKDIR: ${AGENT_WORKDIR:-}
      QQCHAT_AGENT_TIMEOUT: ${AGENT_TIMEOUT:-900}
      QQCHAT_AGENT_TARGET: ${AGENT_TARGET:-auto}
      QQCHAT_AGENT_HOST: ${AGENT_HOST:-1}
      QQCHAT_AGENT_SERVER: ${AGENT_SERVER:-1}
      QQCHAT_AGENT_SERVER_TOOLS: ${AGENT_SERVER_TOOLS:-}
      # 服务器 agent 自己的模型接口（留空 = 跟聊天用同一个）
      QQCHAT_AGENT_SERVER_URL: ${AGENT_SERVER_URL:-}
      QQCHAT_AGENT_SERVER_MODEL: ${AGENT_SERVER_MODEL:-}
      QQCHAT_AGENT_SERVER_KEY: ${AGENT_SERVER_KEY:-}
      # 外部设备（pi）用的模型：留空 = pi 自己的默认；面板里可从它的模型列表选
      QQCHAT_AGENT_MODEL: ${AGENT_MODEL:-}
      QQCHAT_AGENT_MASK: ${AGENT_MASK:-1}
      QQCHAT_AGENT_PROMPT: ${AGENT_PROMPT:-}
      QQCHAT_AGENT_SERVER_WORKDIR: ${AGENT_SERVER_WORKDIR:-/data}
      QQCHAT_AGENT_SERVER_STEPS: ${AGENT_SERVER_STEPS:-8}
      QQCHAT_AGENT_SERVER_CMD_TIMEOUT: ${AGENT_SERVER_CMD_TIMEOUT:-60}

      # ---- Agent 运行（三个开关；默认 = 与以前逐字一致）----
      # 行为类配置：只在首次部署当种子，之后以面板保存的值（SQLite）为准。
      # 聊天侧有限步进循环的步数上限（1 = 与以前逐字一致；>1 才进循环，上限 3）
      QQCHAT_MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-1}
      # 1 = `//` 任务每一步也过统一闸门（判定与老白名单一致）；关着 = 零行为变化
      QQCHAT_AGENT_SERVER_GATE: ${AGENT_SERVER_GATE:-0}
      # 本地 HTTP 通道的名单（留空 = 整条通道不建；写短 id，服务端换算成 7e15 起号段）
      QQCHAT_LOCAL_CHANNEL_IDS: ${LOCAL_CHANNEL_IDS:-}

      # ---- 参与闸门（默认关；只收不放 —— 被 @ 仍然照常回）----
      # 行为类配置：只在首次部署当种子，之后以面板「参与状态」卡片为准。
      QQCHAT_PARTICIPATION_GATING: ${PARTICIPATION_GATING:-0}
      QQCHAT_PARTICIPATION_MAX_REPLIES: ${PARTICIPATION_MAX_REPLIES:-3}
      QQCHAT_PARTICIPATION_COOLDOWN: ${PARTICIPATION_COOLDOWN:-20}
      QQCHAT_PARTICIPATION_PROBING: ${PARTICIPATION_PROBING:-1}
      QQCHAT_PARTICIPATION_ACTIVE_LIFE: ${PARTICIPATION_ACTIVE_LIFE:-900}
      QQCHAT_PARTICIPATION_EXITING_LIFE: ${PARTICIPATION_EXITING_LIFE:-180}

      # ---- 健康日报（默认关；纯服务器侧，定时私聊一条状态）----
      QQCHAT_HEALTH_REPORT: ${HEALTH_REPORT:-0}
      QQCHAT_HEALTH_REPORT_TIME: ${HEALTH_REPORT_TIME:-18:00}
      QQCHAT_HEALTH_REPORT_TO: ${HEALTH_REPORT_TO:-}

      # ---- 表情包（全库共用一份；行为类配置以 settings.json 为准，这里只当种子）----
      QQCHAT_STICKERS: ${STICKERS:-1}
      QQCHAT_STICKER_MAX: ${STICKER_MAX:-120}
      QQCHAT_STICKER_CANDIDATES: ${STICKER_CANDIDATES:-6}
      QQCHAT_STICKER_CURATE_INTERVAL: ${STICKER_CURATE_INTERVAL:-3600}
      QQCHAT_STICKER_COOLDOWN: ${STICKER_COOLDOWN:-120}
      QQCHAT_ENABLE_POKE: ${ENABLE_POKE:-1}
      QQCHAT_POKE_COOLDOWN: ${POKE_COOLDOWN:-45}
      QQCHAT_MOOD_TTL: ${MOOD_TTL:-7200}
      # 图片下载的 SSRF 防护默认开；只有“自建 NapCat 回内网地址”时才设 1
      QQCHAT_ALLOW_PRIVATE_IMAGE_HOSTS: ${ALLOW_PRIVATE_IMAGE_HOSTS:-0}
      # ---- 语音消息（TTS）----
      # 下面这几项都属“行为配置”：只在**首次部署**（还没有 settings.json 时）当种子，
      # 之后 settings.json 是唯一所有者，改这里不会再生效 —— 要调请用面板「语音消息」卡片。
      QQCHAT_ENABLE_VOICE: ${ENABLE_VOICE:-0}
      QQCHAT_VOICE: ${TTS_VOICE:-zh_CN-huayan-medium}
      QQCHAT_VOICE_SPEED: ${VOICE_SPEED:-100}
      QQCHAT_VOICE_MAX_CHARS: ${VOICE_MAX_CHARS:-80}
      QQCHAT_TTS_URL: ${TTS_URL:-http://tts:5000}
      # ---- 官方通道（QQ 开放平台；与私域 NapCat 并存、互不串台）----
      # 开之前先在开放平台把服务器的**出口 IP** 加进白名单，否则连不上（正式环境）。
      # appid 写在这里没事，secret 是密钥（下面这行只从环境变量读，不落盘）。
      QQCHAT_OFFICIAL: ${OFFICIAL_ENABLED:-0}
      QQCHAT_OFFICIAL_APP_ID: ${OFFICIAL_APP_ID:-}
      QQCHAT_OFFICIAL_APP_SECRET: ${OFFICIAL_APP_SECRET:-}
      QQCHAT_OFFICIAL_SANDBOX: ${OFFICIAL_SANDBOX:-0}
      # 官方通道自己的白名单（写**别名号**，面板会话列表里能看到）；留空 = 全部接受。
      # ⚠ 别把真实群号写这儿 —— 那是私域那份名单的事。
      QQCHAT_OFFICIAL_WHITELIST_GROUPS: ${OFFICIAL_WHITELIST_GROUPS:-}
      QQCHAT_OFFICIAL_WHITELIST_PRIVATES: ${OFFICIAL_WHITELIST_PRIVATES:-}
      # ---- 联网搜索 ----
      # 同样是行为配置：只在首次部署当种子；之后请用面板「联网搜索」卡片调。
      QQCHAT_WEB_SEARCH: ${WEB_SEARCH:-1}
      QQCHAT_SEARCH_USE_MODEL: ${SEARCH_USE_MODEL:-1}
      QQCHAT_SEARCH_SOURCES: ${SEARCH_SOURCES:-wiki|https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch={q}&format=json&srlimit=5&utf8=1}
      QQCHAT_SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
      QQCHAT_SEARCH_TIMEOUT: ${SEARCH_TIMEOUT:-20}
      QQCHAT_SEARCH_READ_CHARS: ${SEARCH_READ_CHARS:-1800}
      QQCHAT_VERBOSE: ${VERBOSE:-1}
      # ---- 内存（1 核 1G 的机器上得看着点）----
      # .NET 默认让 GC 堆随负载长，实测常驻 ~300MB；这两行是**软上限**（让 GC 更积极，
      # 不是 cgroup 硬杀），目标是把机器人压在 ~200MB 以内：聊天这种负载用不到更多。
      # 如果以后 CPU 因 GC 变高（或日志里 GC 频繁），把 HeapHardLimit 提到 0x10000000（256MB）。
      DOTNET_GCHeapHardLimit: ${GC_HEAP_LIMIT:-0xC000000}
      DOTNET_ServerGC: ${DOTNET_SERVER_GC:-0}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data                                # 设置 / 会话 / 人物档案 / 日志
    ports:
      # 健康检查 / 状态，仅本机可访问（容器内 HEALTHCHECK 不受影响）
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "dotnet", "/app/BotAgent.Headless.dll", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - qqchat

  # ─────────── 语音合成（云端 TTS 旁路服务） ───────────
  # 为什么单独开一个容器：语音是“偶尔用”的能力 —— 它挂了只该影响语音（机器人会降级成发文字），
  # 不能拖垮对话；而且它的密钥（云厂商 API Key）与机器人的模型 Key 是分开的两套。
  #
  # 2026-09-21 改造：**不再跑本地模型**。原来这里跑 Piper（ONNX，镜像 490MB、常驻 200MB+ 内存、
  # 每句话几百毫秒~几秒 CPU 推理），在 1 核 1G 的机器上性价比太低；现在只有一层
  # “转发到云端 TTS”的轻量代理（~60MB 镜像、~20MB 内存、零推理），音色也更自然。
  # 镜像来自仓库里的 tools/tts-cloud.Dockerfile（python:3.11-alpine，无第三方依赖）。
  # 契约没变：GET /speak?text=…&voice=…&speed=… 返音频（面板试听要 wav，所以默认就是 wav）；
  #           机器人**不**搬运音频 —— 它把 http://tts:5000/speak?… 这个 URL 交给协议端，
  #           由 NapCat 自己下载并转 silk（所以 tts 必须和 napcat 在同一个网络里）。
  # 必须配 MINIMAX_API_KEY（或改用另一个后端）。没配也不会崩：容器照常起，
  # 面板「试听一句」会把“缺 key”这个真正原因直接告诉你。
  tts:
    build:
      context: .
      dockerfile: tools/tts-cloud.Dockerfile
    image: qqchat-tts:latest
    container_name: qqchat-tts
    restart: unless-stopped
    # 日志上限：与其它服务一致，小硬盘上不设上限迟早吃满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=5000
      - TZ=${TZ:-Asia/Shanghai}
      # 后端：minimax（默认）| openai（任何 OpenAI 兼容的 /v1/audio/speech）
      - TTS_PROVIDER=${TTS_PROVIDER:-minimax}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      # 国内站 api.minimaxi.com / 国际站 api.minimax.io —— key 与站点要配对，配错报 1004/2049
      - MINIMAX_API_BASE=${MINIMAX_API_BASE:-https://api.minimaxi.com}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-speech-2.8-hd}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID:-}
      # OpenAI 兼容后端（只有 TTS_PROVIDER=openai 时才用）
      - OPENAI_TTS_API_KEY=${OPENAI_TTS_API_KEY:-}
      - OPENAI_TTS_BASE_URL=${OPENAI_TTS_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-alloy}
      # 默认音色跟着云端走（老配置里的 Piper 名 zh_CN-* 云端不认，代理会回落到这个）
      - DEFAULT_VOICE=${TTS_VOICE:-male-qn-qingse}
      - DEFAULT_FORMAT=${TTS_FORMAT:-wav}
      - MAX_CHARS=${VOICE_MAX_CHARS:-300}
      - CACHE_DIR=/cache
      - CACHE_MAX_MB=${TTS_CACHE_MB:-80}
      # 官方通道发语音要腾讯 SILK；把编码器塞进镜像要用构建参数（见该 Dockerfile 顶部）
      - SILK_ENCODER=${SILK_ENCODER:-silk_v3_encoder}
    volumes:
      - ./tts-cache:/cache                        # 合成结果缓存（同一句话不重复花钱）
    # 只给宿主机的自测入口（机器人/协议端走内部网络，不需要这个）
    ports:
      - "127.0.0.1:5010:5000"
    networks:
      - qqchat

networks:
  qqchat:
    driver: bridge

# ══════════════════════════════════════════════════════════════
#  备选：反向 WebSocket（机器人监听 3001，NapCat 主动连入）
#  优点：不必在 NapCat WebUI 里开正向 WS；改配置后两边都能重连。
#
#  1) 把 qqchat 服务的这两行改掉：
#       QQCHAT_ONEBOT_PROTOCOL: ReverseWebSocket
#       QQCHAT_ONEBOT_URL: http://0.0.0.0:3001
#     并给它加端口暴露：
#       ports:
#         - "3001:3001"
#  2) 在 NapCat WebUI（http://<主机IP>:6099）→ 网络配置 → 添加「反向 WebSocket」
#     URL 填 ws://qqchat:3001，Token 与 ONEBOT_TOKEN 一致
#
#  ⚠️ Docker 版 NapCat 的限制：收不到语音与文件消息（纯文字/图片正常）。
# ══════════════════════════════════════════════════════════════
